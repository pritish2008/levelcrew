<script>window.TRAINABLE = {"v":1,"company":"Brij Design Studio","product":"Claude Power-Up (sample)","code":"TR","fileSlug":"claude-power-up-sample","storageKey":"trainable:demo:v1","progressUrl":"","preview":false,"glossary":{"prompt":{"t":"Prompt","d":"Whatever you type to Claude: a question, a request or a full brief."},"model":{"t":"Model","d":"Which version of Claude’s “brain” answers you. Bigger models are better at hard jobs, but slower, and they use up your limit faster."},"effort":{"t":"Effort","d":"How hard Claude thinks before it answers. More effort means a more careful answer that takes longer and uses more of your limit."},"limit":{"t":"Usage limit","d":"Every plan lets you use Claude a certain amount before you have to wait for it to reset. Bigger models and more effort use it up faster."},"project":{"t":"Project","d":"A workspace in Claude for one client or campaign. You add instructions and files once, and every chat inside it starts already briefed."},"project instructions":{"t":"Project instructions","d":"Standing rules for a Project, like the tone of voice or words to avoid. Claude follows them in every chat inside that Project."},"memory":{"t":"Memory","d":"Things Claude remembers about you from past chats, like your role and how you like things written. You can see and change them in Settings."},"incognito chat":{"t":"Incognito chat","d":"A chat that isn’t saved to your chat history or to Claude’s memory."},"context":{"t":"Context","d":"Everything Claude can see while it answers: your message, attached files, the chat so far and any Project instructions."},"artifact":{"t":"Artifact","d":"Something Claude makes in its own panel next to the chat, like a document, a web page or a small tool. You can use it, change it and share it."},"skill":{"t":"Skill","d":"A saved set of instructions for a job you do often, like “write in our house style”. Claude uses it by itself whenever that job comes up."},"connector":{"t":"Connector","d":"A link between Claude and another app you use, like Google Drive, Gmail or Canva, so Claude can read from it or work in it."},"custom connector":{"t":"Custom connector","d":"A connector you add yourself by pasting a link from the tool’s own website, for tools that aren’t in Claude’s list."},"web search":{"t":"Web search","d":"Lets Claude look things up on the internet and show you links to where it found them."},"research":{"t":"Research","d":"A deeper web search. Claude reads many sources and writes a report with links to each one. It takes longer than a normal answer."},"cowork":{"t":"Cowork","d":"The part of the Claude app where Claude works through a many-step job on its own, using the files you give it, and hands back finished files."},"folder instructions":{"t":"Folder instructions","d":"Notes for Claude about one folder: what’s in it, how files are named and what it must never touch. Claude reads them every time it works there."},"claude code":{"t":"Claude Code","d":"A version of Claude that works directly inside a project’s files. It can read them, change them and run them, and you approve what it does."},"desktop app":{"t":"Claude desktop app","d":"The Claude app you install on your computer, from claude.com/download. It has Chat, Cowork and Code."},"terminal":{"t":"Terminal","d":"A window where you type commands instead of clicking. On a Mac it’s the Terminal app. On Windows it’s called PowerShell."},"command":{"t":"Command","d":"A short instruction you type and send, like “claude” in a terminal, or “/init” inside Claude Code."},"slash command":{"t":"Slash command","d":"A command that starts with “/”, typed into Claude Code, like /init or /model. It runs one of Claude Code’s built-in jobs."},"code editor":{"t":"Code editor","d":"An app for opening and editing a website’s files, like VS Code. Think of it as Word, but for code."},"vs code":{"t":"VS Code","d":"A free code editor from Microsoft, used by lots of web developers. Claude Code can run inside it."},"project folder":{"t":"Project folder","d":"The folder on your computer that holds all of a website’s files. Claude Code only works inside the folder you open."},"claude.md":{"t":"CLAUDE.md","d":"A plain text file in your website’s folder with rules for Claude. Claude finds it and reads it by itself every time you start. You don’t need to connect it."},"/init":{"t":"/init","d":"A Claude Code command. Type it and press Enter: Claude looks through your website’s files and writes a first CLAUDE.md for you."},"plan mode":{"t":"Plan mode","d":"A Claude Code setting where Claude only reads and suggests a plan. It changes nothing until you say yes."},"manual mode":{"t":"Manual mode","d":"A Claude Code setting where Claude asks before every change, and shows you exactly what it wants to change."},"/rewind":{"t":"/rewind","d":"A Claude Code command that undoes Claude’s recent changes to your files. It can’t undo commands Claude ran, like deleting files."},"git":{"t":"Git","d":"A save history for code, a bit like version history in Google Docs. Every saved point can be brought back."},"commit":{"t":"Commit","d":"A saved point in Git: a snapshot of your files that you can go back to. Just ask Claude to “commit” and it makes one."},"branch":{"t":"Branch","d":"A separate copy of the code for trying changes, without touching the main version of the site."},"diff":{"t":"Diff","d":"A before-and-after view of a change: lines being removed show in red, lines being added in green."},"build":{"t":"Build","d":"The step that turns a website’s code into the finished site. If the build fails, something is broken, so it’s a quick health check."},"lint":{"t":"Lint","d":"An automatic checker that spots mistakes and messy code, like a spell-checker for code."},"tests":{"t":"Tests","d":"Small automatic checks that confirm the site still works after a change. Not every website has them."},"staging":{"t":"Staging site","d":"A private copy of the website for trying changes safely before they go on the real site."},"live site":{"t":"Live site","d":"The real website that visitors and clients see."},"deploy":{"t":"Deploy","d":"Putting changes onto the live website."},".env file":{"t":".env file","d":"A private file that holds a website’s passwords and secret keys. Never share it or paste it into a chat."},"api key":{"t":"API key","d":"A secret code that lets one app use another app’s service. Treat it like a password."},"meta description":{"t":"Meta description","d":"The short summary that shows under a page’s title in Google results."},"title tag":{"t":"Title tag","d":"A page’s title: the blue link in Google results and the text on the browser tab."},"canonical":{"t":"Canonical URL","d":"The main web address of a page, so search engines don’t treat copies of it as separate pages."},"structured data":{"t":"Structured data (JSON-LD)","d":"Extra code that tells search engines exactly what a page is about, like a product’s price or its reviews."},"redirect":{"t":"301 redirect","d":"A permanent forward from an old web address to a new one, so visitors and Google end up on the right page."},"core web vitals":{"t":"Core Web Vitals","d":"Google’s measures of how fast and steady a page feels to the people visiting it."},"wcag":{"t":"WCAG","d":"The international rules for making websites usable by people with disabilities."},"csv":{"t":"CSV","d":"A simple spreadsheet file that almost every tool can open and export."},"utm":{"t":"UTM tags","d":"Labels added to the end of a link, so your analytics show exactly where each visitor came from."},"search console":{"t":"Search Console","d":"Google’s free tool that shows how your site appears in Google search, and what people searched to find it."}},"ranks":[{"min":0,"name":"Google Mode","desc":"Short questions, first answers."},{"min":100,"name":"Prompt Rookie","desc":"Starting to brief instead of search."},{"min":300,"name":"Brief Writer","desc":"Role, context, goal, output."},{"min":550,"name":"Context Crafter","desc":"Claude rarely has to guess."},{"min":850,"name":"AI Director","desc":"Assigns processes, not tasks."},{"min":1150,"name":"Workflow Architect","desc":"Builds systems that repeat."},{"min":1450,"name":"Claude Power-User","desc":"Officially stopped using Claude like Google."}],"vocab":{},"person":null,"cta":{"title":"Want this for your team?","text":"We build a training like this from your team's own emails, quotes and reports, built for your Claude plan. You see who finished and how they scored.","links":[{"label":"Book a call","url":"https://wa.me/919833500288?text=Hi%2C%20I%27d%20like%20to%20book%20a%20call%20about%20LevelCrew"}]},"tasks":[],"resume":null,"levels":[{"id":"L0","num":0,"title":"The ==wake-up== call","short":"The wake-up call","tagline":"Same Claude. Very different results.","deliverable":"A new way of seeing Claude","learn":["Why two people get wildly different results from the same Claude"],"steps":[{"type":"hero","hideBar":true,"xp":10,"eyebrow":"Brij Design Studio · Internal training","title":"Same Claude. ==Very different== results.","lede":"Stop using Claude like Google. Learn to brief it, feed it and put it to work like the sharpest person on your team.","meta":[{"icon":"grid","text":"5 short levels"},{"icon":"trophy","text":"XP, ranks and a certificate"},{"icon":"target","text":"Ends with a challenge on your real work"}],"sid":"s1"},{"type":"poll","xp":10,"eyebrow":"Warm-up","title":"Be honest. How do you use Claude today?","lede":"No wrong answers. This just tells us where you’re starting.","options":[{"label":"Like Google: quick question, quick answer.","reply":"Most people start here. Search engines reward short questions. Claude rewards full briefs. The next level fixes this."},{"label":"Captions, emails and quick copy.","reply":"Good instinct, small ambition. The next levels show how much more Claude can take on."},{"label":"I paste something in and say “make it better”.","reply":"You’re one step away. The next level shows you what to say instead of “better”."},{"label":"I barely use it.","reply":"Perfect. No bad habits to unlearn. Let’s build good ones."},{"label":"A lot, but the results are hit or miss.","reply":"Hit-or-miss usually means the brief changes every time. The next level and Projects make your results consistent."}],"sid":"s2"},{"type":"showdown","xp":10,"eyebrow":"The showdown","title":"Same Claude. Same task. ==Two employees.==","lede":"Both were asked to post about the ghee roast dosa at Dakshin Table, a premium South Indian restaurant in Bandra. Press run and compare.","runHint":"Watch both answers arrive.","a":{"name":"Employee A","initial":"A","role":"Uses Claude like Google","color":"#8c92b5","good":false,"prompt":"Write a caption for this restaurant.","output":"🍽️✨ Craving something delicious? Come and experience the amazing flavours at our restaurant! Perfect for family, friends and foodies. Visit us today! 😋\n\n#food #foodie #restaurant #yummy #instafood #foodlover #delicious","verdict":["Generic","7 hashtags","Could be any restaurant"]},"b":{"name":"Employee B","initial":"B","role":"Briefs Claude like a strategist","color":"#2e3bff","good":true,"prompt":"You’re the social media strategist for Dakshin Table, a premium South Indian restaurant in Bandra, Mumbai. Audience: 25–40 year-old professionals who grew up on home-style South Indian food and want it done beautifully. Voice: warm, confident, a little witty. No foodie clichés.\n\nWrite 3 Instagram captions for our ghee roast dosa (the batter ferments for 36 hours). Under 40 words each, one sensory detail, a soft call to book weekend brunch, max 2 hashtags.","output":"**1.** 36 hours of fermenting. 4 seconds of crunch. Our ghee roast dosa is made the slow way, the way your ammamma insisted on. Weekend brunch tables go fast: book via the link in bio. #DakshinTable #BandraBrunch\n\n**2.** Some things shouldn’t be rushed. Our batter rests for a day and a half so your Sunday doesn’t have to. Ghee roast, gunpowder, filter coffee. Brunch is served. #DakshinTable\n\n**3.** You’ll hear it before you taste it. Crisp, golden, glistening with ghee. The dosa people cross the city for is on the weekend brunch menu. Reserve via the link in bio. #DakshinTable #MumbaiEats","verdict":["Specific","On-brand","Ready for client review"]},"sid":"s3"},{"type":"quiz","xp":20,"eyebrow":"Quick question","title":"What made the difference?","options":[{"label":"Employee B has a paid Claude plan.","why":"Same Claude, same plan. Nothing technical changed."},{"label":"Employee B is a better writer.","why":"Claude did the writing both times. Employee B just described what good looks like."},{"label":"Employee B gave Claude the information a real strategist would need.","correct":true,"why":"Brand, audience, voice, product detail, format and rules. That’s a brief."},{"label":"Employee B got lucky. AI is random.","why":"Run Employee A’s prompt ten times and you’ll get ten versions of the same generic caption."}],"reveal":{"eyebrow":"Remember this","big":"The difference wasn’t intelligence. It was ==instruction==.","text":"Claude can’t see your client’s brand book, last week’s meeting or what the client hated last time. It only knows what you tell it."},"sid":"s4"},{"type":"write","xp":60,"eyebrow":"Your turn","title":"Rescue this prompt","lede":"Rewrite Employee A’s prompt so Claude can’t get it wrong. Use the facts below. Messy is fine.","bad":"Write a caption for this restaurant.","facts":{"title":"The facts you have","tag":"Dakshin Table","rows":[{"k":"Client","v":"Dakshin Table, a premium South Indian restaurant in Bandra, Mumbai"},{"k":"The post","v":"A new dessert: filter coffee tiramisu"},{"k":"Audience","v":"25–40 year-old urban professionals"},{"k":"Goal","v":"More weekend brunch bookings"},{"k":"Voice","v":"Warm, confident, a little witty. No clichés."}]},"label":"Your rescued prompt","placeholder":"Start with who Claude should be, then add the facts that matter…","chips":[{"label":"Role","insert":"You’re the social media strategist for "},{"label":"Audience","insert":"Audience: "},{"label":"Goal","insert":"Goal: "},{"label":"Tone","insert":"Tone: "},{"label":"Avoid","insert":"Avoid: "},{"label":"Format","insert":"Give me 3 options, each under 40 words."}],"checks":[{"id":"role"},{"id":"brand","label":"The brand","what":"Says who the client is","tip":"Name the client and what it is: “Dakshin Table, a premium South Indian restaurant in Bandra.”","rule":{"all":[["dakshin","south indian","restaurant"],["premium","bandra","mumbai","south indian"]]}},{"id":"product","label":"The product","what":"Says what the post is about","tip":"Mention the dessert: the new filter coffee tiramisu.","rule":{"all":[["tiramisu","dessert"]]}},{"id":"audience","tip":"Add the audience: “25–40 year-old urban professionals.”"},{"id":"goal","tip":"Add the goal: “more weekend brunch bookings.”"},{"id":"constraints","label":"Tone and rules","tip":"Add the voice and rules: “Warm, confident, a little witty. No clichés.”"},{"id":"format","tip":"Say what you want back: “3 captions, each under 40 words, with a call to book brunch.”"}],"expert":"You’re the social media lead for Dakshin Table, a premium South Indian restaurant in Bandra, Mumbai. Write 3 Instagram captions for our new filter coffee tiramisu.\n\nAudience: 25–40 year-old urban professionals. Goal: more weekend brunch bookings.\nVoice: warm, confident, a little witty. No clichés like “indulge” or “foodie heaven”.\n\nEach caption under 35 words, with one sensory detail and a soft call to book brunch. Max 2 hashtags.","expertNote":"Notice it isn’t long. Every sentence just carries a fact Claude needs.","task":"Rewrite “Write a caption for this restaurant.” so Claude writes great Instagram captions for Dakshin Table (a premium South Indian restaurant in Bandra) promoting a new filter coffee tiramisu to 25–40 year-old professionals, to drive weekend brunch bookings.","saveAs":"rescue","saveTitle":"Rescued caption prompt","sid":"s5"},{"type":"summary","takeaway":"Claude’s output is only as good as ==your brief==.","points":["Short, vague prompts get short, generic answers.","Claude only knows what you tell it.","Next: a simple formula for briefing it properly."],"sid":"s6"}]},{"id":"L1","num":1,"title":"Stop writing ==terrible== prompts","short":"Stop writing terrible prompts","tagline":"A prompt is a brief. Here’s how to write a great one in 60 seconds.","deliverable":"A prompt formula you’ll use every day","learn":["The 6 parts of a great brief","Why better information beats longer prompts","How to check your own prompt before you send it","How to get AI to help you write the prompt"],"steps":[{"type":"intro","sid":"s1"},{"type":"cards","xp":30,"xpLabel":"Formula unlocked","eyebrow":"The formula","title":"A prompt is a brief. Great briefs have ==6 parts==.","lede":"You already write briefs for designers and freelancers. Same rules. Open each card.","mnemonic":[{"word":"Real","color":"#ff5a36"},{"word":"Creatives","color":"#2e3bff"},{"word":"Give","color":"#00a676"},{"word":"Insanely","color":"#e0418b"},{"word":"Clear","color":"#e89a00"},{"word":"Orders","color":"#7a4dff"}],"cards":[{"letter":"R","title":"Role","q":"Who should Claude be?","color":"#ff5a36","body":"Sets the expertise and the point of view.","example":"You’re a senior social media strategist who has launched 20+ café brands in India.","why":"A “marketing expert” writes like a textbook. A café specialist writes like a café specialist."},{"letter":"C","title":"Context","q":"What’s the situation?","color":"#2e3bff","body":"The brand, the audience, what’s happening right now.","example":"Kora Coffee is a premium specialty café in Bandra. Audience: 18–30, students and young professionals who care about design and quality.","why":"Without it, Claude writes for a generic brand and a generic audience."},{"letter":"G","title":"Goal","q":"What does success look like?","color":"#00a676","body":"The business result, not just the deliverable.","example":"Launch our cold brew range and get people to try it in-store within 30 days.","why":"“Make posts” and “drive trials” lead to very different ideas."},{"letter":"I","title":"Input","q":"What should Claude work from?","color":"#e0418b","body":"Real material: briefs, menus, past posts, data.","example":"Attached: the campaign brief, the cold brew menu and our 5 best-performing posts.","why":"Real material beats descriptions. Claude reads files, screenshots and spreadsheets."},{"letter":"C","title":"Constraints","q":"What are the rules?","color":"#e89a00","body":"Tone, length, must-haves and no-gos.","example":"No cringe marketing language. No generic AI words like “elevate” or “indulge”. Keep the voice sophisticated.","why":"Rules remove the stuff you’d delete anyway."},{"letter":"O","title":"Output","q":"What should it hand back?","color":"#7a4dff","body":"The exact format, length and number of options.","example":"10 concepts in a table: concept name, hook, format, visual idea, why it works.","why":"You get something you can paste into a deck, not an essay."}],"sid":"s2"},{"type":"builder","xp":40,"eyebrow":"Prompt builder","title":"Build a prompt. Pick ==one piece per row==.","lede":"Choose what you think is the strongest option in each row and watch the prompt strength change. Then run it.","task":"**The job:** an Instagram campaign for Kora Coffee’s new cold brew range.","slots":[{"key":"ROLE","color":"#ff5a36","q":"Who should Claude be?","options":[{"text":"You’re a marketing expert.","q":1},{"text":"You’re a senior social media strategist who has launched 20+ café brands in India.","q":2},{"text":"","label":"Skip it","q":0}]},{"key":"CONTEXT","color":"#2e3bff","q":"What’s the situation?","options":[{"text":"Kora Coffee is a premium specialty café in Bandra, Mumbai. Our audience is 18–30: students and young professionals who care about design and quality.","q":2},{"text":"It’s a café in Mumbai.","q":1},{"text":"","label":"Skip it","q":0}]},{"key":"GOAL","color":"#00a676","q":"What does success look like?","options":[{"text":"Make some posts.","q":0},{"text":"Create an Instagram campaign.","q":1},{"text":"Plan an Instagram campaign for our new cold brew range. Goal: get people to try it in-store within 30 days.","q":2}]},{"key":"INPUT","color":"#e0418b","q":"What should it work from?","options":[{"text":"Here’s some info about the brand.","q":1},{"text":"","label":"Skip it","q":0},{"text":"Attached: the campaign brief, the cold brew menu and our 5 best-performing posts.","q":2}]},{"key":"CONSTRAINTS","color":"#e89a00","q":"What are the rules?","options":[{"text":"No cringe marketing language. No generic AI words like “elevate” or “indulge”. Keep the voice sophisticated.","q":2},{"text":"Keep it professional.","q":1},{"text":"","label":"Skip it","q":0}]},{"key":"OUTPUT","color":"#7a4dff","q":"What should it hand back?","options":[{"text":"Give me a list of ideas.","q":1},{"text":"Give me 10 concepts in a table: concept name, hook, format, visual idea, why it works.","q":2},{"text":"","label":"Skip it","q":0}]}],"outputs":{"weak":{"verdict":"Could be any café, anywhere, any year","text":"Here are some Instagram ideas for your café! ☕\n\n1. Post a photo of your coffee with a catchy caption\n2. Share behind-the-scenes content of your baristas\n3. Run a giveaway to boost engagement\n4. Use trending audio for Reels\n5. Repost photos from happy customers\n\nConsistency is key! Post regularly and engage with your followers. 🚀"},"ok":{"verdict":"Better. Still not something you’d show a client","text":"Here are 10 Instagram ideas for your café in Mumbai:\n\n1. **Cold Brew Mondays**: a weekly feature on your cold brew\n2. **Meet the barista**: short Reels introducing your team\n3. **Latte art time-lapse**\n4. **Customer of the week**\n5. **Monsoon specials** carousel\n6. **Behind the bar**: how cold brew is made\n7. **Poll**: hot or iced?\n8. **Coffee and work**: laptop-friendly café shots\n9. **Seasonal menu launch**\n10. **Giveaway**: tag a friend to win\n\nLet me know if you’d like captions for any of these!"},"strong":{"verdict":"Specific, on-brand, measurable. A first draft you could present","text":"Here are 10 concepts for the Kora cold brew launch. Each is built to get people into the café to try it within 30 days.\n\n| Concept | Hook | Format | Visual idea | Why it works |\n|---|---|---|---|---|\n| The 18-Hour Wait | “We started making this yesterday.” | Reel | Time-lapse of the overnight steep, ending on the first pour | Turns slow brewing into a quality story |\n| Tasting Flight | “Three cold brews. One right answer: yours.” | Carousel | Three glasses on marble, tasting notes in clean type | Gives people a reason to visit and compare |\n| Desk to Kora | “Your 4 pm slump has a new address.” | Reel | POV walk from a Bandra co-working desk to the Kora counter | Speaks to the young professionals nearby |\n| Bean Passport | “Coorg, Chikmagalur, Araku. Pick your origin.” | Carousel | Map illustration, one origin per slide | Rewards the quality-curious audience |\n| First Sip Friday | “Say ‘cold brew’ at the counter. First one’s on us.” | Story + post | Bold type on brand colour, poll sticker | A trial driver you can measure |\n\n_Plus 5 more: barista picks, a pairing guide, cold brew tonic, a 30-day challenge and a regulars’ wall._\n\nWant me to turn the top 3 into full scripts?"}},"sid":"s3"},{"type":"tiers","xp":10,"eyebrow":"Bad vs better vs expert","title":"Longer isn’t better. ==Denser== is better.","lede":"Same task, four prompts. Tap through all four.","tabs":[{"label":"Bad","kind":"bad","prompt":"Give me Instagram ideas for a café.","notes":["- No brand, no audience, no goal","- No format, so you get a random list"],"result":"A generic list: “Post latte art! Run a giveaway! Use trending audio!”"},{"label":"Better","kind":"mid","prompt":"Give me 10 Instagram post ideas for a premium café in Mumbai targeting young professionals. Make them trendy.","notes":["+ Has an audience and a number","- “Trendy” is vague","- No goal, no brand voice, no format"],"result":"10 decent ideas. Nothing you couldn’t have thought of in 5 minutes."},{"label":"Expert","kind":"good","prompt":"You’re a senior social strategist for Kora Coffee, a premium café in Bandra (audience: 18–30, design-conscious). We’re launching a cold brew range; the goal is in-store trials within 30 days. Using the attached brief and our top 5 posts, give me 10 concepts in a table: name, hook, format, visual, why it works. No clichés like “elevate” or “indulge”.","notes":["+ Every sentence carries information","+ Role, context, goal, input, rules and format","+ About 70 words, no fluff"],"result":"Ten specific, on-brand concepts in a table you can paste into a deck."},{"label":"Long but useless","kind":"bad","prompt":"Hi Claude! I hope you’re doing well. I would really, really appreciate it if you could please help me come up with some absolutely amazing, creative, unique, viral, engaging, out-of-the-box Instagram ideas for a café that will make people love it. Please make them super creative and very engaging and amazing. Thank you so much!!","notes":["- Longer than the Better prompt","- Less information than the Bad one","- Adjectives are not instructions"],"result":"The same generic list as the Bad prompt, with extra enthusiasm."}],"callout":{"eyebrow":"The big idea","title":"You don’t need longer prompts. You need ==better information==.","text":"Every sentence should tell Claude something it couldn’t guess."},"sid":"s4"},{"type":"multi","xp":15,"eyebrow":"Spot the gaps · 1 of 2","title":"What’s this prompt missing?","lede":"Tap every part of the formula that’s missing, then press Check.","context":{"prompt":"Write 5 subject lines for our Diwali sale email. Keep them under 50 characters.","label":"The prompt"},"columns":"250px","options":[{"label":"**Role**: who Claude should be","status":"correct","why":"No role, so you get a generic copywriter voice."},{"label":"**Context**: brand, product, audience","status":"correct","why":"Which brand? What’s on sale? Who’s reading?"},{"label":"**Goal**: what success looks like","status":"correct","why":"Opens? Clicks? Sales? Each needs different lines."},{"label":"**Input**: material to work from","status":"neutral","why":"Optional here. Pasting last year’s best subject lines would help."},{"label":"**Constraints**: rules and limits","status":"wrong","why":"It has one: under 50 characters."},{"label":"**Output**: format and quantity","status":"wrong","why":"It has one: 5 subject lines."}],"perfect":"Spot on. It has a format and a limit, but Claude still has to guess the brand, the audience and the point.","sid":"s5"},{"type":"multi","xp":15,"eyebrow":"Spot the gaps · 2 of 2","title":"And this one?","lede":"Tap every part of the formula that’s missing.","context":{"prompt":"You’re a senior copywriter. Our client Luma Skin is launching a vitamin C serum for sensitive skin, aimed at 22–35 year-olds. Write the product page copy.","label":"The prompt"},"columns":"250px","options":[{"label":"**Role**: who Claude should be","status":"wrong","why":"It has one: senior copywriter."},{"label":"**Context**: brand, product, audience","status":"wrong","why":"It has one: Luma Skin, the serum, the audience."},{"label":"**Goal**: what success looks like","status":"correct","why":"Convert first-time buyers? Build trust? Explain the science?"},{"label":"**Input**: material to work from","status":"neutral","why":"Helpful: the ingredient list and product sheet."},{"label":"**Constraints**: rules and limits","status":"correct","why":"Skincare needs rules: no medical claims, tone, length."},{"label":"**Output**: format and quantity","status":"correct","why":"Which sections? How long? How many headline options?"}],"perfect":"Nailed it. Great role and context, but no goal, no rules and no format. In skincare, missing rules can mean claims legal won’t approve.","sid":"s6"},{"type":"write","xp":80,"eyebrow":"Mini challenge","title":"Write a prompt for ==5 Reel concepts==","lede":"Ask Claude for 5 Instagram Reel concepts for a restaurant. Use a real client or make one up.","label":"Your prompt","placeholder":"e.g. You’re a short-form video strategist for restaurants…","chips":[{"label":"Role","insert":"You’re a short-form video strategist for restaurants."},{"label":"Context","insert":"The restaurant: "},{"label":"Audience","insert":"Audience: "},{"label":"Goal","insert":"Goal: "},{"label":"Rules","insert":"Rules: under 30 seconds each, shootable on a phone, no clichés."},{"label":"Format","insert":"For each concept, give me a title, a 3-second hook, a shot-by-shot outline and on-screen text."}],"checks":[{"id":"objective","label":"Clear objective","what":"Asks for 5 Reel concepts","tip":"Say exactly what you want: “5 Instagram Reel concepts”.","rule":{"all":[["reel","reels"],["5","five"]]}},{"id":"context","tip":"Describe the restaurant: cuisine, location, what makes it special."},{"id":"audience","tip":"Say who the Reels are for, e.g. “25–40 year-old professionals in Mumbai”."},{"id":"constraints","tip":"Add rules: length, tone, what to avoid. e.g. “Under 30 seconds, shootable on a phone, no clichés.”"},{"id":"format","tip":"Say what each concept should include: title, hook, shots, on-screen text."},{"id":"role","bonus":true,"w":0.5},{"id":"goal","label":"Business goal","bonus":true,"w":0.5,"tip":"Bonus: say what the Reels should achieve, e.g. more weekend bookings."}],"expert":"You’re a short-form video strategist for restaurants. Our client is Dakshin Table, a premium South Indian restaurant in Bandra, Mumbai.\nAudience: 25–40 year-old professionals. Goal: more weekend brunch bookings.\n\nGive me 5 Instagram Reel concepts. For each: a title, a 3-second hook, a shot-by-shot outline (max 5 shots), on-screen text, and why it will work for this audience.\n\nRules: under 30 seconds each, shootable on a phone in one afternoon, no clichés like “foodie heaven”.","task":"Write a prompt asking Claude for 5 Instagram Reel concepts for a restaurant.","saveAs":"reels","saveTitle":"Reel concepts prompt","sid":"s7"},{"type":"chat","xp":15,"eyebrow":"Pro move","title":"Stuck? Let ==AI write the prompt== with you.","lede":"Paste a rough idea into Claude, ChatGPT or any AI chat and ask it to turn the idea into a proper brief. Press Send to watch.","chatTitle":"Prompt helper · simulated","turns":[{"role":"user","text":"Improve this prompt: “write reel ideas for our restaurant client”. Ask me questions first."},{"role":"claude","text":"Happy to. Four quick questions first:\n\n1. **Which restaurant?** What’s the food, where is it, and what makes it special?\n2. **Who should the Reels reach?**\n3. **What should they achieve?** Bookings, followers, awareness?\n4. **Any rules?** Length, tone, things to avoid."},{"role":"user","send":"Answer the questions","text":"Dakshin Table, premium South Indian in Bandra. For 25–40 year-old professionals. Goal: more weekend brunch bookings. Under 30 seconds, shot on a phone, no clichés."},{"role":"claude","think":1100,"text":"Here’s your improved prompt:\n\n\u003e You’re a short-form video strategist for restaurants. Our client is Dakshin Table, a premium South Indian restaurant in Bandra, Mumbai. Audience: 25–40 year-old professionals. Goal: more weekend brunch bookings.\n\u003e\n\u003e Give me 5 Instagram Reel concepts. For each: a title, a 3-second hook, a shot-by-shot outline, on-screen text, and why it will work.\n\u003e\n\u003e Rules: under 30 seconds, shootable on a phone, no clichés like “foodie heaven”."}],"callout":{"title":"Rough idea in, ==proper brief== out.","text":"Use it whenever you’re stuck. Then read the brief before you use it: you know the client, the AI doesn’t."},"templates":[{"label":"Prompt helper: improve my prompt","text":"Improve this prompt: “[paste your rough prompt]”.\nRewrite it as a clear brief with a role, context, goal, input, constraints and output format. Ask me questions first about anything important that’s missing."},{"label":"Prompt helper: interview me","text":"I need help with [the task]. Before you write anything, interview me: ask one question at a time until you have everything you need. Then write the prompt I should use."}],"footer":"This works in any AI chat, including ChatGPT. Only paste client information into AI tools the agency has approved.","sid":"s8"},{"type":"summary","takeaway":"Real Creatives Give Insanely Clear Orders.","points":["**R**ole, **C**ontext, **G**oal, **I**nput, **C**onstraints, **O**utput.","Better information beats longer prompts.","Pro move: end with “Ask me any questions before you start.”","Stuck? Ask an AI to turn your rough idea into a brief."],"template":"ROLE: You’re a [role, e.g. senior social media strategist for skincare brands].\nCONTEXT: [Brand, audience, situation, what’s been tried before.]\nGOAL: [What success looks like, e.g. more weekend bookings.]\nINPUT: [What I’m attaching or pasting.]\nCONSTRAINTS: [Tone, length, words to avoid, must-haves.]\nOUTPUT: [Format, number of options, structure.]\nBefore you start, ask me any questions you need answered.","templateLabel":"Your brief template (copy it)","sid":"s9"}]},{"id":"L6","num":2,"title":"Projects, memory \u0026 ==reusable context==","short":"Projects \u0026 memory","tagline":"Brief once. Reuse forever.","deliverable":"Never explain the client twice","learn":["How Projects give every chat a built-in brief","What memory does, and where it lives","What to do when a long chat starts forgetting things"],"steps":[{"type":"intro","sid":"s1"},{"type":"concept","eyebrow":"The problem","title":"You’ve explained Luma Skin to Claude ==47 times== this month.","lede":"Every new chat starts from zero. So you paste the same brand info, audience and rules again. Or you skip it and get generic work.","callout":{"eyebrow":"The fix","title":"A ==Project== is a workspace for one client or campaign.","text":"Add instructions and files once. Every chat inside it starts already briefed. You’ll find Projects in the Claude sidebar."},"sid":"s2"},{"type":"project","xp":40,"eyebrow":"Build it","title":"Set up a Project for ==Luma Skin==","lede":"Pick the instructions and files a strategist would want. Then start a chat and see the difference.","defaultName":"Luma Skin · Social","instructions":[{"text":"You’re the senior strategist on the Luma Skin account.","good":true},{"text":"Voice: clear, science-backed, warm. Never preachy.","good":true},{"text":"Audience: 22–35, metro India, sensitive skin.","good":true},{"text":"Never make medical claims or promise results. Avoid “flawless” and “glass skin”.","good":true},{"text":"Be creative and amazing.","good":false,"warn":"Adds nothing. Claude already tries."},{"text":"Give options with a one-line reason for each. Ask questions if a brief is unclear.","good":true}],"files":[{"text":"brand-guidelines.pdf","type":"pdf","good":true},{"text":"tone-of-voice-examples.docx","type":"docx","good":true},{"text":"office-party-photos.zip","type":"zip","good":false,"warn":"Irrelevant files add noise."},{"text":"audience-personas.pdf","type":"pdf","good":true},{"text":"q3-performance-report.xlsx","type":"xlsx","good":true},{"text":"salary-slips-2026.pdf","type":"pdf","good":false,"warn":"Never upload confidential personal data."},{"text":"product-catalogue-2026.pdf","type":"pdf","good":true}],"chatPrompt":"3 captions for the new SPF 50 gel sunscreen launch.","answer":"Here are 3 options in Luma’s voice, written for our 22–35 sensitive-skin audience:\n\n1. **SPF 50 that feels like nothing.** Our new gel sunscreen sinks in fast, leaves no white cast, and was tested on sensitive skin. Your daily step, simplified.\n_Why: leads with the number one complaint about sunscreen, the texture._\n\n2. **Sensitive skin deserves sun protection that doesn’t sting.** Meet our SPF 50 gel: fragrance-free, lightweight, made for every day.\n_Why: speaks straight to the audience’s biggest worry._\n\n3. **Sunscreen you’ll actually wear.** The best SPF is the one you use every day. New SPF 50 gel, out now.\n_Why: honest and habit-focused, with no exaggerated claims._\n\nWant me to adapt these for Reels or stories?","sid":"s3"},{"type":"guide","xp":20,"eyebrow":"Try it now","title":"Make your first ==real Project==","lede":"Pick one client, customer or area of work you deal with every week. Open Claude in another tab and follow along, ticking each step.","items":[{"title":"Open Projects","body":"In Claude, click **Projects** in the left sidebar, or go to claude.ai/projects."},{"title":"Create the Project","body":"Click **+ New Project** at the top right. Name it after the client or the work, then create it."},{"title":"Add the rules","body":"Click **Set project instructions**. Paste the starter below, replace the [brackets] with your details, then click **Save instructions**. These are the [[project instructions]]."},{"title":"Add the files","body":"Click the **+** on the right of the Project page and upload the reference files you’d give a new colleague: guidelines, examples of good work, price lists, templates."},{"title":"Start a chat inside it","body":"Type a request in the message box on the Project page. Claude is already briefed, so a short request is enough."},{"title":"Share it with your team","body":"On a Team plan, click **Share project** next to the Project name, add your teammates, and choose **Can view** or **Can edit**. Now everyone starts from the same brief."}],"template":{"label":"Project instructions starter","text":"You help me with [the area of work, e.g. patient reminders, site reports, one client’s account].\nAbout us: [what we do, where, and who we serve].\nHow to write: [3–4 words, e.g. clear, warm, short].\nNever: [details, claims or topics to leave out, e.g. names or ID numbers].\nAlways: ask me questions if something is unclear, and point out anything I should check before it goes out."},"footer":"Buttons move around between versions. If something looks different, look for the same idea: a new Project, its instructions, and its files.","sid":"s4","setupId":"project-setup","setupLabel":"Project"},{"type":"sort","xp":30,"eyebrow":"What goes where?","title":"Instructions, files, or ==just the chat==?","buckets":[{"key":"ins","label":"Instructions"},{"key":"files","label":"Project files"},{"key":"chat","label":"Chat message"}],"items":[{"text":"Brand voice rules","answer":"ins","why":"How Claude should always behave goes in the instructions."},{"text":"Brand guidelines PDF","answer":"files","why":"Reference documents go in the project files."},{"text":"Today’s task: 5 Diwali captions","answer":"chat","why":"One-off tasks go in the chat."},{"text":"Never use the word “flawless”","answer":"ins","why":"A standing rule belongs in the instructions."},{"text":"Last quarter’s performance report","answer":"files","why":"Background data goes in the project files."},{"text":"“Make option 2 shorter”","answer":"chat","why":"Feedback on this draft goes in the chat."},{"text":"Always ask questions if a brief is unclear","answer":"ins","why":"A standing behaviour belongs in the instructions."},{"text":"Customer personas","answer":"files","why":"Reference material goes in the project files."}],"success":"Perfect. Rules go in instructions, reference material in files, today’s task in the chat.","sid":"s5"},{"type":"cards","xp":10,"eyebrow":"Memory","title":"What Claude remembers, and ==where==","lede":"Memory and Projects work together. Open each card.","wide":true,"cards":[{"icon":"users","title":"Memory","q":"Claude remembers you","color":"#7a4dff","body":"Claude can remember details from past chats: your role, how you like things written, what you’re working on. This is its [[memory]]. You can see and edit what it remembers in **Settings**, or just say “Remember that I…”."},{"icon":"folder","title":"Each Project has its own memory","q":"What happens in a project stays there","color":"#2e3bff","body":"Every Project keeps its own files, instructions and memory. Client A’s details won’t leak into Client B’s project."},{"icon":"eye","title":"Incognito chats","q":"When you don’t want it remembered","color":"#00a676","body":"Start an incognito chat for anything you don’t want saved to your memory or chat history."},{"icon":"target","title":"Rule of thumb","q":"Where should client facts live?","color":"#e89a00","body":"Put client facts in the **Project**, where the whole team can rely on them. Let memory handle **you**: your role, your style, your preferences."}],"sid":"s6"},{"type":"quiz","xp":20,"eyebrow":"Long chats","title":"Your chat is 80 messages long and Claude keeps forgetting decisions from the start. Best move?","options":[{"label":"Keep going and repeat yourself louder.","why":"The chat just gets longer and messier."},{"label":"Ask Claude to summarise everything decided so far, then start a fresh chat with that summary.","correct":true,"why":"A clean summary in a new chat makes Claude sharp again."},{"label":"Delete everything and start from zero.","why":"You’d lose the good work. Summarise it first."},{"label":"Switch to a different AI.","why":"Every AI has this limit. The fix is the same."}],"explain":"Very long chats get cluttered, and Claude can lose track of early details. Start fresh with a handover summary. Inside a Project, the brief carries over automatically.","sid":"s7"},{"type":"quiz","xp":20,"eyebrow":"Team setup","title":"Your team handles 6 clients. What’s the best setup?","options":[{"label":"One giant chat for all six clients","why":"Clients’ details bleed into each other, and it gets slow and confused."},{"label":"A new blank chat every time","why":"You’d re-explain every client forever."},{"label":"One Project per client, with brand files and instructions, shared with the team","correct":true,"why":"Everyone starts briefed, and the brief stays consistent."},{"label":"Everyone keeps it in their heads","why":"That’s how briefs get lost when someone’s on leave."}],"explain":"Sharing Projects with colleagues is available on Team and Enterprise plans. Ask your admin how your workspace is set up.","sid":"s8"},{"type":"summary","takeaway":"Brief once. ==Reuse forever.==","points":["One Project per client: instructions for behaviour, files for knowledge.","Memory handles you. Projects handle the client.","Long chat going off track? Summarise, then start fresh."],"sid":"s9"}]},{"id":"L7","num":3,"title":"Claude ==Cowork==","short":"Claude Cowork","tagline":"Chat gives you answers. Cowork gives you finished work.","deliverable":"Finished files, not just answers","learn":["What Cowork is, and when to use it instead of chat","How to delegate a task and stay in control","How to set up Cowork on your computer, step by step","The ground rules for letting Claude work on your files"],"steps":[{"type":"intro","sid":"s1"},{"type":"concept","eyebrow":"What is Cowork?","title":"Chat gives you answers. Cowork gives you ==finished work==.","lede":"In Cowork, you describe the result you want. Claude makes a plan, works through it on its own, and hands you finished files.","visual":{"kind":"flow","nodes":[{"title":"You","short":"Describe the finished result"},{"title":"Claude","short":"Plans, works, checks"},{"title":"You","short":"Review and send"}]},"body":"- **Works with your files.** In the Claude desktop app, connect a folder and Claude can read, organise and create files in it.\n- **Makes real documents.** Spreadsheets with formulas, presentations, reports.\n- **Keeps going without you.** Tasks can run in the background, and recurring jobs can run on a schedule.\n- **You stay in charge.** You choose how often it asks before it acts.","note":"Cowork is in the Claude app on paid plans. You’ll set it up, step by step, later in this level.","sid":"s2"},{"type":"compare","eyebrow":"Same task, two ways","title":"40 feedback screenshots → ==one organised tracker==","cols":[{"tag":"In chat","kind":"bad","steps":["Upload screenshots in batches","Ask Claude to read each batch","Copy the answers","Paste them into Excel","Fix the formatting","Repeat four times","Build the summary tab yourself"],"stat":{"big":"7","label":"steps for you"}},{"tag":"In Cowork","kind":"good","steps":["“Read every screenshot in the Luma feedback folder. Group the feedback by theme and urgency. Create feedback-tracker.xlsx with a summary tab.”","Review the finished file"],"stat":{"big":"2","label":"steps for you"}}],"sid":"s3"},{"type":"cowork","xp":40,"eyebrow":"Watch it work","title":"Delegate the ==monthly report==","lede":"A job every account team knows. Start the task and watch Cowork plan, work and deliver.","folder":"Luma Skin / November report","files":[{"name":"meta-ads-export.csv","type":"csv"},{"name":"google-analytics.pdf","type":"pdf"},{"name":"instagram-insights.png","type":"png"},{"name":"october-report.pptx","type":"pptx"},{"name":"final-final-v2.pptx","type":"pptx","junk":true},{"name":"final-final-v3.pptx","type":"pptx","junk":true},{"name":"final-USE-THIS.pptx","type":"pptx","junk":true}],"task":"Create Luma Skin’s November performance report from the data files in this folder. Follow the layout of october-report.pptx and save it as november-report.pptx. Then write a short summary email for the client.","plan":[{"t":"Read the 3 data files","log":"Reading meta-ads-export.csv, google-analytics.pdf, instagram-insights.png…"},{"t":"Calculate month-on-month changes","log":"Purchases +18% · reach +21% · cost per purchase −9%"},{"t":"Find the 3 biggest insights","log":"Click-through back to 1.7% · retargeting return 4.3x · Reels 58% of reach"},{"t":"Build the deck in October’s layout","log":"Creating november-report.pptx (9 slides)…","ms":1500},{"t":"Write the client email","log":"Drafting client-email.docx…"},{"t":"Check every number against the source files","log":"24 numbers checked · 0 mismatches"}],"approval":{"after":3,"title":"Claude wants to delete 3 old files","text":"While building the deck, Claude found final-final-v2.pptx, final-final-v3.pptx and final-USE-THIS.pptx, and suggests deleting them to tidy the folder.","allowNote":"Done, they’re gone. It turned out fine this time, but deleting wasn’t part of your task. When Claude asks for something you didn’t request, it’s fine to say no.","denyNote":"Good call. Deleting wasn’t part of the task, so Claude carries on with just the report."},"outputs":[{"name":"november-report.pptx","type":"pptx"},{"name":"client-email.docx","type":"docx"}],"doneCallout":{"eyebrow":"Your job now","title":"Review it like a manager, ==then== send it.","text":"Check the numbers, the story and the tone. Cowork did the legwork. You own the result."},"result":"**november-report.pptx** (9 slides, in October’s layout)\n- Purchases up 18%, reach up 21%, cost per purchase down 9% on October\n- Three insights: click-through back to 1.7%, retargeting returning 4.3x, Reels bringing 58% of reach\n- Next month’s plan on the last slide\n\n**client-email.docx**\n- A short summary of the month for Luma Skin, with the three insights and a link to the deck","sid":"s4"},{"type":"sort","xp":25,"eyebrow":"Chat or Cowork?","title":"Which is the ==better fit==?","buckets":[{"key":"chat","label":"Chat"},{"key":"cowork","label":"Cowork"}],"items":[{"text":"Brainstorm 5 taglines","answer":"chat","why":"Quick thinking work suits chat."},{"text":"Rename and sort 300 product photos into folders by category","answer":"cowork","why":"Lots of files and lots of steps: Cowork."},{"text":"Turn 8 clients’ spreadsheets into one summary deck","answer":"cowork","why":"Several files in, a finished file out: Cowork."},{"text":"Get a second opinion on a subject line","answer":"chat","why":"A quick question suits chat."},{"text":"Every Monday, compile last week’s numbers into a report","answer":"cowork","why":"Recurring work can run on a schedule in Cowork."},{"text":"Rewrite one paragraph in a friendlier tone","answer":"chat","why":"A small, one-off edit suits chat."},{"text":"Read 25 interview transcripts and write a findings doc","answer":"cowork","why":"Long, file-heavy work: Cowork."}],"success":"All correct. Chat for thinking and quick edits. Cowork for multi-step work that ends in a file.","sid":"s5"},{"type":"guide","xp":20,"eyebrow":"Set it up","title":"Get Cowork running ==on your computer==","lede":"Do this once. Tick each step as you go. Not at your computer right now? Continue, and come back to this list later.","items":[{"title":"Install the Claude desktop app","body":"Download it from [claude.com/download](https://claude.com/download). It works on Mac and Windows."},{"title":"Sign in","body":"Cowork needs a paid plan: Pro, Max, Team or Enterprise. On a Team plan it’s switched on by default. Can’t see it? Ask your admin to check **Organization settings → Cowork**."},{"title":"Switch to Cowork","body":"In the message box, choose **Cowork**. No Chat/Cowork switch? Then your app already handles Cowork tasks in any conversation."},{"title":"Pick one folder","body":"Click **Work in a project or folder** and choose one project folder, like _Sales / November report_. Claude can only see the folders you pick. Never pick your whole computer."},{"title":"Add folder instructions","body":"These are the [[folder instructions]]: what’s inside, how files are named, and what Claude must never touch. Easiest way: start your first task with “Save these as the folder instructions:” and list them. Claude reads them every time it works there."},{"title":"Choose how much Claude asks","body":"Pick a mode in the message box.\n- **Manual:** Claude asks before it acts. Start here.\n- **Auto:** it keeps going without asking at every step.\n- **Skip:** no pauses, and nothing checks its actions. Avoid it for important work."},{"title":"Run a small, safe first task","body":"Try: “List every file in this folder with a one-line summary of each. Don’t move or delete anything.” Check the result, then hand it something bigger."}],"extras":[{"icon":"layers","title":"Connect your tools","text":"Google Drive, Gmail, Slack and more. These links are called [[connectors|connector]]. Add them from the **+** menu in the message box.","color":"var(--sw-5)"},{"icon":"clock","title":"Put repeat jobs on a schedule","text":"Type /schedule in a task, or click Scheduled in the left sidebar. Scheduled tasks run in the cloud, even when your computer is off.","color":"var(--sw-2)"},{"icon":"send","title":"Start tasks from your phone","text":"Cowork is also in the Claude phone app and on claude.ai. Files on your computer are only reachable while the desktop app is open.","color":"var(--sw-6)"}],"footer":"Menus and names change often. If something looks different, look for the same three things: pick a folder, choose how much Claude asks, then describe the finished result.","callout":{"title":"You’re set up. Start small, ==then delegate bigger==."},"sid":"s6","setupId":"cowork-setup","setupLabel":"Cowork"},{"type":"cards","xp":15,"eyebrow":"Ground rules","title":"Six rules for letting Claude ==work on your files==","lede":"Open each card.","cards":[{"icon":"folder","title":"Give it one folder","color":"#ff7a00","body":"Connect a specific project folder, not your whole computer."},{"icon":"target","title":"Describe “done”","color":"#2e3bff","body":"Say what the finished file looks like, what it’s called and where it goes."},{"icon":"eye","title":"Check the plan first","color":"#00a676","body":"Claude shows its plan before it starts. Fix the plan, not the output."},{"icon":"alert","title":"Stay in charge","color":"#e0418b","body":"Choose how often Claude asks before acting. For anything important, keep approvals on, and say no to anything you didn’t ask for."},{"icon":"check","title":"Review before it’s real","color":"#7a4dff","body":"Claude can make mistakes. Check numbers and facts before anything reaches a client."},{"icon":"refresh","title":"Back up, then automate","color":"#00a3e0","body":"Work on copies of important files at first. Once a task works well, put it on a schedule."}],"sid":"s7"},{"type":"summary","takeaway":"Delegate outcomes, not keystrokes. Then ==review like a manager==.","points":["Describe the finished result, approve the plan, review the files.","Chat for thinking. Cowork for multi-step work that ends in a file.","Set up once: desktop app, one folder, Manual mode to start.","Say no to anything you didn’t ask for."],"sid":"s8"}]},{"id":"LF","num":11,"label":"Final","code":"F","title":"The ==real work== challenge","short":"The real work challenge","tagline":"Use everything on a task from your actual to-do list.","deliverable":"Real work, done better, today","learn":["Brief Claude on a real task using the full formula","Do the work in Claude with a focus clock running","Leave with your certificate and a personal cheat sheet"],"steps":[{"type":"intro","sid":"s1"},{"type":"mission","xp":170,"minutes":30,"eyebrow":"Final mission","title":"Do ==real work==, better, right now","lede":"Pick a task you actually need to do today. Brief it here, then get it done in Claude.","nextLabel":"See your certificate","examples":["Plan next week’s posts for a client","Draft a proposal from call notes","Write ad copy variations","Prep for a client meeting","Summarise a report for a client","Reply to tricky client feedback"],"fields":[{"key":"role","label":"Role: who should Claude be?","ph":"e.g. a senior social media strategist for skincare brands","w":10},{"key":"context","label":"Context: brand, audience, situation","ph":"e.g. Luma Skin, a D2C brand for sensitive skin. Audience 22–35 in metro India…","w":20,"long":true,"min":6},{"key":"goal","label":"Goal: what does success look like?","ph":"e.g. 5,000 units sold in the first month","w":15},{"key":"input","label":"Input: what will you attach or paste?","ph":"e.g. brand guidelines, last month’s top posts, the launch brief","w":15},{"key":"constraints","label":"Constraints: rules, tone, no-gos","ph":"e.g. no medical claims, warm but expert, under 40 words each","w":15,"long":true},{"key":"output","label":"Output: what should Claude hand back?","ph":"e.g. a table of 5 posts with hook, caption and call to action","w":15}],"toggles":[{"key":"ask","label":"Ask me questions first","line":"Before you start, ask me any questions you need answered to do this brilliantly.","w":4},{"key":"steps","label":"Work step by step","line":"Work step by step: analyse what I’ve given you, find the key insight, create, then critique your own work and improve it before showing me the final version.","w":3},{"key":"options","label":"Give me options","line":"Give me 3 options with a one-line reason for each.","w":3}],"moves":[{"title":"I gave Claude real material","text":"Files, screenshots, examples or data."},{"title":"I asked for options, not one answer","text":"And picked the best one myself."},{"title":"I gave specific feedback at least twice","text":"Keep this, change that, give me X."},{"title":"I asked Claude to critique its own work","text":"Before accepting a draft."},{"title":"I checked facts and numbers","text":"Before using anything with a client."},{"title":"I saved something reusable","text":"A Project, a prompt or a workflow."}],"taskPlaceholder":"e.g. Plan next week’s Instagram posts for Luma Skin","sid":"s2"},{"type":"certificate","hideNext":true,"nextSteps":"**What next?** Keep your cheat sheet handy, set up one Project for your main client this week, and share your best prompt with your team. The fastest way to get better is to use Claude on real work every day.","sid":"s3"}]}]};</script>
